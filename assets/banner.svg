<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Gabriel Cordoba · Data Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1128"/>
      <stop offset="1" stop-color="#13214A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B78F0" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3B78F0"/>
      <stop offset="1" stop-color="#8FB6F7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B78F0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B78F0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <!-- grilla sutil -->
  <g stroke="#1F2B4D" stroke-width="1">
    <line x1="640" y1="90" x2="1220" y2="90"/>
    <line x1="640" y1="150" x2="1220" y2="150"/>
    <line x1="640" y1="210" x2="1220" y2="210"/>
  </g>
  <!-- curva de crecimiento -->
  <path d="M640 236 C 700 226, 740 212, 790 214 S 880 188, 930 176 S 1020 150, 1070 118 S 1160 80, 1220 62 L1220 260 L640 260 Z" fill="url(#area)"/>
  <path d="M640 236 C 700 226, 740 212, 790 214 S 880 188, 930 176 S 1020 150, 1070 118 S 1160 80, 1220 62" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1220" cy="62" r="7" fill="#8FB6F7"/>
  <circle cx="1220" cy="62" r="14" fill="#8FB6F7" fill-opacity="0.2"/>
  <!-- barras -->
  <g fill="#D95926" fill-opacity="0.85">
    <rect x="700" y="244" width="22" height="16" rx="3"/>
    <rect x="760" y="236" width="22" height="24" rx="3"/>
    <rect x="820" y="228" width="22" height="32" rx="3"/>
    <rect x="880" y="222" width="22" height="38" rx="3"/>
    <rect x="940" y="212" width="22" height="48" rx="3"/>
  </g>
  <!-- texto -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="118" font-size="54" font-weight="700" fill="#E6EAF2">Gabriel Cordoba</text>
    <text x="66" y="162" font-size="24" font-weight="600" fill="#8FB6F7">Data Analyst · MBA · Project Management</text>
    <text x="66" y="208" font-size="19" fill="#B4BDD3">Turning data into strategic, data-driven decisions.</text>
    <text x="66" y="244" font-size="15" letter-spacing="1.5" fill="#8A96B3">POWER BI · SQL · PYTHON · TABLEAU · LOOKER · MONGODB</text>
